---
apiVersion: v1
kind: Service
metadata:
  name: uploader-api
spec:
  selector:
    app: uploader-api
  ports:
    - port: {{ .Values.uploader_api.port }}
      targetPort: {{ .Values.uploader_api.port }}
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uploader-api
spec:
  entryPoints:
  {{- if .Values.ingress.ssl_enabled }}
    - websecure
  {{- end }}
  {{- if or .Values.ingress.tls_resolver (not .Values.ingress.ssl_enabled) }}
    - web
  {{- end }}
  routes:
  - match: 'Host(`uploader-api.{{ .Values.hostname }}`)'
    kind: Rule
    services:
    - name: uploader-api
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.uploader_api.port }}
    middlewares:
      - name: sts-and-basic-response-headers
  {{- if .Values.ingress.tls_resolver }}
  tls:
    certResolver: {{ .Values.ingress.tls_resolver }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploader-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uploader-api
  template:
    metadata:
      labels:
        app: uploader-api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uploader-api
          image: {{ .Values.uploader.image.name }}:{{ .Values.uploader.image.tag }}
          env:
            - name: GATEWAY_URL
              value: http://gateway.{{ .Release.Namespace }}.svc.cluster.local:7070
          {{- include "render-env-vars" (dict "service_name" "uploader_api" "Values" .Values) }}
          ports:
            - containerPort: {{ .Values.uploader_api.port }}
              protocol: TCP